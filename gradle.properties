# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=false
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# The older compatibility SDK exposes a larger compile classpath. Give both
# Gradle and the Kotlin compiler enough headroom for clean release builds.
org.gradle.jvmargs=-Xmx2g
kotlin.daemon.jvmargs=-Xmx2g
# IntelliJ Platform already provides Kotlin at runtime. Bundling another stdlib
# in the plugin can shadow the platform version and break IDE services.
kotlin.stdlib.default.dependency=false
